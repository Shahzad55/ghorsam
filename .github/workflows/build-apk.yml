name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Ghorsam Clean Android 16 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK (clean)
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package and MainActivity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== APK contents ==="
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex|AndroidManifest.xml' || true

          echo "=== MainActivity check across ALL DEX files ==="
          FOUND=0
          while IFS= read -r DEX; do
            echo "Checking $DEX"
            if unzip -p "$APK" "$DEX" | grep -a -q "com/shahzad55/ghorsam/MainActivity"; then
              echo "OK: MainActivity found in $DEX"
              FOUND=1
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*\.dex$')

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: MainActivity was not found in any DEX file."
            exit 1
          fi

          echo "OK: MainActivity is present in the APK."

      - name: Upload Android 16 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghorsam-clean-android16-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android 16 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="v1.3-clean"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Ghorsam v1.3 — Clean Android 16 Test" \
              --notes "Ghorsam Android 1.2 (versionCode 3), built for Android 16 / API 36. Minimum Android 7.0 / API 24. Debug APK for phone testing." \
              --latest
          fi